version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
        - printf "DATABASE_URL=\"%s\"\n" "$DATABASE_URL" > .env
        - printf "TELEGRAM_BOT_TOKEN=\"%s\"\n" "$TELEGRAM_BOT_TOKEN" >> .env
        - printf "TELEGRAM_CHAT_ID=\"%s\"\n" "$TELEGRAM_CHAT_ID" >> .env
        - npx prisma generate
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
